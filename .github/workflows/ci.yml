name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration in supabase/migrations/ to a fresh local
      # stack. This is what actually proves the RLS policies work, not
      # just that the migration's SQL is well-formed -- runs on every push
      # and PR (not gated to main), since it needs no production secrets.
      - name: Start local Supabase stack
        run: supabase start

      - name: Export local stack URL/anon key
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            >> "$GITHUB_ENV"

      - name: Run RLS policy tests
        run: npm run test:rls

  migrate:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # Applies any migrations under supabase/migrations/ not yet recorded
      # as applied on the linked project. Already-applied migrations are
      # skipped, so this is safe to run on every push to main. A failing
      # migration exits non-zero and fails this job.
      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      # Run *after* the push above, so a legitimately-new migration isn't
      # mistaken for drift. What this catches is the remote schema no
      # longer matching what supabase/migrations/ describes -- typically
      # a change made directly in the Supabase dashboard.
      - name: Check for schema drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db diff --linked --schema public > drift.sql
          if grep -vE '^\s*(--.*)?$' drift.sql | grep -q .; then
            echo "::error::Remote schema has drifted from supabase/migrations/"
            cat drift.sql
            exit 1
          fi
          echo "No drift detected."
